<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Basic SEO Meta Tags -->
  <title>Markdown Studio - Free Online Markdown Editor & Live Previewer</title>
  <meta name="description" content="Markdown Studio is a fast, responsive, dark-themed online Markdown editor with real-time preview, word counter, and syntax highlighting. Built by Bro-Chill-20.">
  <meta name="keywords" content="Markdown Studio, Markdown Editor, Bro-Chill-20, Online Markdown Preview, Live Markdown Editor, HTML Preview, GitHub Pages Editor">
  <meta name="author" content="Bro-Chill-20">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Social Media Meta Tags (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bro-chill-20.github.io/markdown-studio/">
  <meta property="og:title" content="Markdown Studio - Online Markdown Editor">
  <meta property="og:description" content="Write Markdown with instant real-time live preview and code highlighting. Responsive and dark-themed editor.">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Markdown Studio - Online Markdown Editor">
  <meta name="twitter:description" content="Fast and interactive Markdown editor built by Bro-Chill-20.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Highlight.js CSS for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-sky-500/10 p-2 rounded-lg border border-sky-500/20">
          <i class="fa-solid fa-[#38bdf8] fa-file-code text-2xl text-[#38bdf8]"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wide text-white">Markdown Studio</h1>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Actions/Buttons if any -->
      </div>
    </div>
  </header>

  <!-- Main Application Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- Editor Section -->
    <div class="flex flex-col bg-gray-800 rounded-xl border border-gray-700 shadow-xl overflow-hidden">
      <div class="bg-gray-800/80 px-4 py-3 border-b border-gray-700 flex justify-between items-center text-xs text-gray-400 font-semibold tracking-wider uppercase">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-[#38bdf8]"></i> Editor
        </span>
        <span id="word-count">0 words | 0 chars</span>
      </div>
      <textarea id="editor" class="w-full h-[500px] md:h-full p-4 bg-gray-900 text-gray-200 resize-none focus:outline-none font-mono text-sm leading-relaxed" placeholder="Type your Markdown here..."></textarea>
    </div>

    <!-- Live Preview Section -->
    <div class="flex flex-col bg-gray-800 rounded-xl border border-gray-700 shadow-xl overflow-hidden">
      <div class="bg-gray-800/80 px-4 py-3 border-b border-gray-700 flex justify-between items-center text-xs text-gray-400 font-semibold tracking-wider uppercase">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-[#38bdf8] fa-eye text-[#38bdf8]"></i> Live Preview
        </span>
      </div>
      <div id="preview" class="w-full h-[500px] md:h-full p-4 md:p-6 overflow-y-auto bg-gray-900 text-gray-200 prose prose-invert max-w-none">
        <!-- Rendered HTML will appear here -->
      </div>
    </div>

  </main>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
